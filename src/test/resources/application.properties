spring.application.name=locationlens

# H2 in-memory database for Calfinity tests, so the suite never needs a real database.
# These properties take effect once a JDBC/JPA starter and the com.h2database:h2
# test dependency are added to pom.xml; until then Spring ignores them.
spring.datasource.url=jdbc:h2:mem:calfinity-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.security.oauth2.client.registration.common-idp.provider=keycloak
spring.security.oauth2.client.registration.common-idp.client-id=test-client
spring.security.oauth2.client.registration.common-idp.client-secret=test-secret
spring.security.oauth2.client.registration.common-idp.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.common-idp.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.common-idp.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost/oauth2/authorize
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost/oauth2/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/oauth2/jwks
