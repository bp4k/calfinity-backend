spring.application.name=locationlens

# H2 in-memory database for Calfinity tests, so the suite never needs a real database.
# These properties take effect once a JDBC/JPA starter and the com.h2database:h2
# test dependency are added to pom.xml; until then Spring ignores them.
spring.datasource.url=jdbc:h2:mem:calfinity-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
